<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Игры — Gamex</title>
  <link href="/styles/main.css" rel="stylesheet" />
</head>
<body>
  <div class="page">
    <header class="header-nav-row">
      <nav>
        <a href="/">Главная</a>
        <a href="/pages/Game.html" class="active">Игры</a>
        <a href="/pages/Audio.html">Аудио</a>
        <a href="/pages/Portal.html">Портал</a>
        <a href="/pages/Community.html">Сообщество</a>
      </nav>
    </header>

    <div class="main-content">
      <div class="content-row">
        <aside class="left columns">
          <div class="newies">
            <h3>Новости</h3>
            <p>Свежие анонсы и обновления каталога.</p>
            <img src="/icon/news-svgrepo-com.svg" width="20" height="20" alt="">
          </div>
          <div class="dops">
            <h3>Подборки</h3>
            <p>Тематические коллекции игр и подсказки.</p>
            <img src="/icon/news-svgrepo-com.svg" width="20" height="20" alt="">
          </div>
        </aside>

        <main>
          <h1>Каталог игр</h1>

          <div class="games-toolbar">
            <form class="search" role="search" id="game-search-form">
              <label for="game-search" class="visually-hidden">Поиск игр</label>
              <input
                type="search"
                id="game-search"
                placeholder="Поиск по названию, жанру, платформе..."
                autocomplete="off"
              >
              <button type="submit" aria-label="Найти">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <circle cx="11" cy="11" r="8"></circle>
                  <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
              </button>
            </form>
          </div>

          <p class="audio-counter" id="games-counter"></p>

          <div class="games-grid" id="games-grid">
            <p>Загрузка игр с сервера...</p>
          </div>
        </main>
      </div>
    </div>

    <footer class="footer-wrapper">
      <a href="/">Gamex © 2025</a>
    </footer>
  </div>

  <script>
    const GAMES_API = "/api/games";
    let allGames = [];

    async function loadGames() {
      const grid = document.getElementById('games-grid');
      try {
        const r = await fetch(GAMES_API);
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        allGames = await r.json();
        renderGames(allGames);
      } catch (e) {
        grid.innerHTML = `<p style="color:#ff6b6b;grid-column:1/-1;">Не удалось загрузить игры: ${e.message}</p>`;
      }
    }

    function renderGames(items) {
      const grid = document.getElementById('games-grid');
      const counter = document.getElementById('games-counter');

      if (items.length === 0) {
        grid.innerHTML = `<p style="grid-column:1/-1;color:var(--text-mute);">Ничего не найдено.</p>`;
        if (counter) counter.textContent = `Показано 0 из ${allGames.length}`;
        return;
      }

      grid.innerHTML = items.map(item => `
        <a class="game" href="#">
          <div class="game-cover">
            <img src="${item.image_url || '/icon/gamepad-svgrepo-com.svg'}" alt="">
          </div>
          <div class="game-info">
            <h3 class="game-title" title="${escapeHtml(item.title)}">${escapeHtml(item.title)}</h3>
            <p class="game-desc">${escapeHtml(item.genre)} · ${escapeHtml(item.platform)} · ${item.release_year}</p>
            <p class="game-desc" style="color:var(--orange);font-weight:bold;margin-top:4px;">★ ${item.rating ?? '—'}</p>
          </div>
        </a>
      `).join('');

      if (counter) counter.textContent = `Показано ${items.length} из ${allGames.length}`;
    }

    function escapeHtml(str) {
      if (str == null) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function applySearch() {
      const q = document.getElementById('game-search').value.trim().toLowerCase();
      if (!q) {
        renderGames(allGames);
        return;
      }
      const filtered = allGames.filter(g =>
        (g.title || '').toLowerCase().includes(q) ||
        (g.genre || '').toLowerCase().includes(q) ||
        (g.platform || '').toLowerCase().includes(q) ||
        (g.description || '').toLowerCase().includes(q)
      );
      renderGames(filtered);
    }

    // живой поиск по вводу
    document.getElementById('game-search').addEventListener('input', applySearch);

    // сабмит формы не должен перезагружать страницу
    document.getElementById('game-search-form').addEventListener('submit', (e) => {
      e.preventDefault();
      applySearch();
    });

    loadGames();
  </script>
</body>
</html>
