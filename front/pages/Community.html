<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Community — Gamex</title>
  <link href="../styles/main.css" rel="stylesheet" />
  <style>
    .post-form { display: flex; flex-direction: column; gap: 10px; margin-bottom: 24px; background: var(--surface); padding: 16px; border: 1px solid var(--border); border-radius: var(--radius); }
    .post-form input, .post-form textarea { padding: 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface-2); color: var(--text); font-family: inherit; }
    .post-form button { align-self: flex-start; padding: 10px 20px; background: var(--orange); color: #fff; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; }
    .post-card { background: var(--surface-2); border: 1px solid var(--border); padding: 16px; border-radius: var(--radius); margin-bottom: 12px; position: relative; }
    .post-card strong { color: var(--mint); display: block; margin-bottom: 6px; }
    .post-card p { margin: 0 0 10px; color: var(--text); }
    .post-card small { color: var(--text-mute); font-size: 12px; }
    .btn-del-post { position: absolute; top: 12px; right: 12px; background: transparent; border: 1px solid var(--border); color: var(--text-dim); border-radius: 6px; padding: 4px 8px; cursor: pointer; transition: 0.2s; }
    .btn-del-post:hover { background: rgba(255,122,26,.12); color: var(--orange); border-color: var(--orange); }
  </style>
</head>
<body>
  <div class="page">
    <header class="header-nav-row">
      <nav>
        <a href="/" class="active">Главная</a>
        <a href="/pages/Game.html">Игры</a>
        <a href="/pages/Audio.html">Аудио</a>
        <a href="/pages/Portal.html">Портал</a>
        <a href="/pages/Community.html">Сообщество</a>
      </nav>
    </header>

    <main class="main-content">
      <h1>Сообщество</h1>

      <form id="post-form" class="post-form">
        <input name="author" placeholder="Твой ник" required minlength="2" maxlength="60">
        <textarea name="message" placeholder="Что нового?" required maxlength="1000" rows="3"></textarea>
        <button type="submit">Отправить</button>
      </form>

      <div id="posts-list"></div>
    </main>

    <footer class="footer-wrapper">
      <a href="../index.html">Gamex © 2025</a>
    </footer>
  </div>

  <script>
    const POSTS_API = "/api/posts";

    async function loadPosts() {
      const list = document.getElementById('posts-list');
      try {
        const r = await fetch(POSTS_API);
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        const items = await r.json();
        
        if (items.length === 0) {
          list.innerHTML = '<p style="color: var(--text-mute);">Пока тихо. Напишите первым!</p>';
          return;
        }
        
        list.innerHTML = items.map(p => `
          <article class="post-card">
            <button class="btn-del-post" data-id="${p.id}">Удалить</button>
            <strong>${p.author}</strong>
            <p>${p.message}</p>
            <small>${new Date(p.created_at).toLocaleString('ru-RU')}</small>
          </article>
        `).join('');
      } catch (e) {
        list.innerHTML = `<p style="color: red;">Ошибка загрузки: ${e.message}</p>`;
      }
    }

    document.getElementById('posts-list').addEventListener('click', async (e) => {
      if (!e.target.classList.contains('btn-del-post')) return;
      const id = e.target.dataset.id;
      if (!confirm('Удалить этот пост?')) return;

      e.target.disabled = true;
      e.target.textContent = '...';
      try {
        const r = await fetch(`${POSTS_API}/${id}`, { method: 'DELETE' });
        if (r.status !== 204) throw new Error(`HTTP ${r.status}`);
        loadPosts(); // перезагружаем список
      } catch (err) {
        alert('Ошибка удаления: ' + err.message);
        e.target.disabled = false;
        e.target.textContent = 'Удалить';
      }
    });

    document.getElementById('post-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = e.target.querySelector('button');
      btn.disabled = true;
      btn.textContent = 'Отправка...';
      
      const fd = new FormData(e.target);
      try {
        const r = await fetch(POSTS_API, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ author: fd.get("author"), message: fd.get("message") }),
        });
        if (!r.ok) {
          const err = await r.json().catch(() => ({}));
          throw new Error(err.detail ? JSON.stringify(err.detail) : `HTTP ${r.status}`);
        }
        e.target.reset();
        loadPosts();
      } catch (err) {
        alert('Ошибка при отправке: ' + err.message);
      } finally {
        btn.disabled = false;
        btn.textContent = 'Отправить';
      }
    });

    loadPosts();
  </script>
</body>
</html>
