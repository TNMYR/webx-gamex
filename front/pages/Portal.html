<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portal — Gamex</title>
  <link href="../styles/main.css" rel="stylesheet" />
  <style>
    .portal-form { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; background: var(--surface); padding: 16px; border: 1px solid var(--border); border-radius: var(--radius); }
    .portal-form input, .portal-form textarea { padding: 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface-2); color: var(--text); font-family: inherit; }
    .portal-form button { align-self: flex-start; padding: 10px 20px; background: var(--orange); color: #fff; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; }
    .news-card { background: var(--surface); border: 1px solid var(--border); border-left: 4px solid var(--mint); padding: 16px; border-radius: var(--radius); margin-bottom: 12px; }
    .news-card h3 { margin: 0 0 8px; color: var(--text); }
    .news-card p { margin: 0 0 10px; color: var(--text-dim); }
    .news-card small { color: var(--text-mute); }
  </style>
</head>
<body>
  <div class="page">
    <header class="header-nav-row">
      <nav>
        <a href="/" class="active">Главная</a>
        <a href="/pages/Game.html">Игры</a>
        <a href="/pages/Audio.html">Аудио</a>
        <a href="/pages/Portal.html">Портал</a>
        <a href="/pages/Community.html">Сообщество</a>
      </nav>
    </header>

    <main class="main-content">
      <h1>Портал новостей</h1>
      
      <form id="news-form" class="portal-form">
        <input name="title" placeholder="Заголовок новости" required minlength="3" maxlength="200">
        <input name="author" placeholder="Ваше имя" required minlength="2" maxlength="100">
        <textarea name="content" placeholder="Текст новости..." required rows="3"></textarea>
        <button type="submit">Опубликовать</button>
      </form>

      <div id="news-list"></div>
    </main>

    <footer class="footer-wrapper">
      <a href="../index.html">Gamex © 2025</a>
    </footer>
  </div>

  <script>
    const NEWS_API = "/api/news";

    async function loadNews() {
      const list = document.getElementById('news-list');
      try {
        const r = await fetch(NEWS_API);
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        const items = await r.json();
        
        if (items.length === 0) {
          list.innerHTML = '<p style="color: var(--text-mute);">Пока новостей нет. Станьте первым!</p>';
          return;
        }
        
        list.innerHTML = items.map(n => `
          <article class="news-card">
            <h3>${n.title}</h3>
            <p>${n.content}</p>
            <small>${n.author} · ${new Date(n.published_at).toLocaleString('ru-RU')}</small>
          </article>
        `).join('');
      } catch (e) {
        list.innerHTML = `<p style="color: red;">Ошибка загрузки: ${e.message}</p>`;
      }
    }

    document.getElementById('news-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = e.target.querySelector('button');
      btn.disabled = true;
      btn.textContent = 'Отправка...';
      
      const fd = new FormData(e.target);
      try {
        const r = await fetch(NEWS_API, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            title: fd.get("title"),
            author: fd.get("author"),
            content: fd.get("content"),
          }),
        });
        if (!r.ok) {
          const err = await r.json().catch(() => ({}));
          throw new Error(err.detail ? JSON.stringify(err.detail) : `HTTP ${r.status}`);
        }
        e.target.reset();
        loadNews();
      } catch (err) {
        alert('Ошибка при отправке: ' + err.message);
      } finally {
        btn.disabled = false;
        btn.textContent = 'Опубликовать';
      }
    });

    loadNews();
  </script>
</body>
</html>
